name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q

      # Build the image here too, so a Dockerfile that no longer builds fails
      # the run before we ever touch the server.
      - name: Build image
        run: docker build -f docker/Dockerfile -t coach:ci .

  deploy:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Ship source to the VPS
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        # --delete keeps the remote tree in sync; excluded paths (notably the
        # gitignored docker/.env holding the API key, and the runtime data dir)
        # are protected from both transfer and deletion.
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.venv/' \
            --exclude='data/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='.pytest_cache/' \
            --exclude='.env' \
            -e "ssh -i ~/.ssh/id_deploy" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:teach-me/"

      - name: Rebuild and restart the container
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          # absolute path (or ~-relative) to the edge proxy's Caddyfile on the host
          EDGE_CADDYFILE: ${{ vars.EDGE_CADDYFILE }}
          # public hostname the edge proxy serves this app on
          PUBLIC_HOST: ${{ vars.PUBLIC_HOST }}
        run: |
          ssh -i ~/.ssh/id_deploy "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -euo pipefail -s' "$EDGE_CADDYFILE" "$PUBLIC_HOST" <<'REMOTE'
          cd ~/teach-me/docker
          docker compose build
          docker compose up -d

          # Wait for the app to answer on the internal network before moving on.
          for i in $(seq 1 15); do
            if docker exec caddy wget -qO- --timeout=5 http://coach:8000/api/subjects >/dev/null 2>&1; then
              echo "coach is up"; break
            fi
            if [ "$i" = "15" ]; then
              echo "coach did not become healthy:"; docker logs --tail=60 coach; exit 1
            fi
            sleep 2
          done

          # Make sure the edge proxy has the public route. Append-only-if-missing
          # so this never duplicates the block and never touches other site
          # configs; it self-heals if the edge Caddyfile was regenerated.
          CF="${1/#\~/$HOME}"   # EDGE_CADDYFILE, with any leading ~ resolved on the host
          HOST="$2"             # PUBLIC_HOST — the public hostname to route
          if [ -z "$CF" ] || [ -z "$HOST" ]; then
            echo "EDGE_CADDYFILE / PUBLIC_HOST not set — skipping edge route registration"
          elif ! grep -q "$HOST" "$CF"; then
            cp -a "$CF" "$CF.bak.$(date +%Y%m%d-%H%M%S)"
            printf '\n%s {\n\tencode gzip\n\theader Strict-Transport-Security "max-age=31536000"\n\treverse_proxy coach:8000 {\n\t\theader_up X-Forwarded-For {remote_host}\n\t}\n}\n' "$HOST" >> "$CF"
            docker exec caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
            docker exec caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
          fi
          REMOTE

      - name: Smoke test the live URL
        env:
          PUBLIC_HOST: ${{ vars.PUBLIC_HOST }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://$PUBLIC_HOST/api/subjects")
          echo "GET /api/subjects -> $code"
          test "$code" = "200"
