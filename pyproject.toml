[project]
name = "teach-me"
version = "0.1.0"
description = "A generic study tool with per-topic tracking and an LLM tutor"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.60",
    "pydantic>=2",
    "rich>=14",
    "python-dotenv>=1.1",
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["teach_me"]
