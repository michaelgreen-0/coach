# Example config. Copy this to `teach-me.toml` in your working directory and
# edit it, or just run `python -m teach_me` to use this bundled example as-is.
#
# Each [[chapter]] is one thing you're studying — a certification, an exam
# path, a course. You pick a chapter when the app starts. A config can also
# use a single top-level `subject`/`bank` pair instead if it has one chapter.

[[chapter]]
subject = "General Knowledge"
bank = "sample-bank.json"   # relative to this config file

[[chapter]]
subject = "Python Basics"
bank = "python-bank.json"

[tutor]
model       = "claude-sonnet-5"
base_url    = "https://api.anthropic.com/v1/"
api_key_env = "ANTHROPIC_API_KEY"
persona     = "a friendly, encouraging quiz tutor"
guidelines  = """
Explain concepts clearly and concretely. When the student gets something wrong,
explain why their choice is wrong and why the correct answer is right — don't
just restate the answer. Keep replies focused and readable in a terminal.
"""
