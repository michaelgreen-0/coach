# Example config. Copy this to `coach.toml` in your working directory and
# edit it, or just run `python -m coach` to use this bundled example as-is.
#
# Each [[subject]] is one thing you're studying — a certification, an exam
# path, a course. You pick a subject when the app starts. A config with a
# single subject can use the shorthand instead:
#
#   subject = "AWS Cloud Practitioner"
#   bank    = "aws-cloud-practitioner-bank.json"

[[subject]]
name = "AWS Solutions Architect"
bank = "aws-solutions-architect-bank.json"   # relative to this config file

[[subject]]
name = "AWS Cloud Practitioner"
bank = "aws-cloud-practitioner-bank.json"

[[subject]]
name = "Salesforce Administrator"
bank = "salesforce-administrator-bank.json"

[[subject]]
name = "Salesforce Platform Developer I"
bank = "salesforce-platform-developer-1-bank.json"

[[subject]]
name = "Terraform Associate"
bank = "terraform-associate-bank.json"

# Per-user rate limits. These are the defaults; the tutor cap is
# what protects your LLM bill.
#[limits]
#requests_per_minute = 120
#tutor_per_day      = 50

[tutor]
model       = "claude-sonnet-5"
base_url    = "https://api.anthropic.com/v1/"
api_key_env = "ANTHROPIC_API_KEY"
persona     = "a friendly, encouraging quiz tutor"
guidelines  = """
Explain concepts clearly and concretely. When the student gets something wrong,
explain why their choice is wrong and why the correct answer is right — don't
just restate the answer. Keep replies focused and easy to read.
"""
